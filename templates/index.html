<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Approval Prediction</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:650px;
    background:#fff;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:5px;
    font-weight:bold;
    color:#444;
}

input,select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#007BFF;
}

button{
    grid-column:span 2;
    padding:12px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:20px;
    color:green;
    font-weight:bold;
}

@media(max-width:700px){
form{
grid-template-columns:1fr;
}
button{
grid-column:span 1;
}
}
</style>

</head>

<body>

<div class="container">

<h2>Loan Approval Prediction</h2>

<form action="/predict" method="POST">

<div class="input-box">
<label>Gender</label>
<select name="Gender">
<option value="1">Male</option>
<option value="0">Female</option>
</select>
</div>

<div class="input-box">
<label>Married</label>
<select name="Married">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="input-box">
<label>Dependents</label>
<select name="Dependents">
<option value="0">0</option>
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3+</option>
</select>
</div>

<div class="input-box">
<label>Education</label>
<select name="Education">
<option value="1">Graduate</option>
<option value="0">Not Graduate</option>
</select>
</div>

<div class="input-box">
<label>Self Employed</label>
<select name="Self_Employed">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="input-box">
<label>Applicant Income</label>
<input type="number" name="ApplicantIncome" required>
</div>

<div class="input-box">
<label>Coapplicant Income</label>
<input type="number" step="0.01" name="CoapplicantIncome" required>
</div>

<div class="input-box">
<label>Loan Amount</label>
<input type="number" step="0.01" name="LoanAmount" required>
</div>

<div class="input-box">
<label>Loan Amount Term</label>
<input type="number" step="0.01" name="Loan_Amount_Term" required>
</div>

<div class="input-box">
<label>Credit History</label>
<select name="Credit_History">
<option value="1">Good (1)</option>
<option value="0">Bad (0)</option>
</select>
</div>

<div class="input-box">
<label>Property Area</label>
<select name="Property_Area">
<option value="0">Rural</option>
<option value="1">Semiurban</option>
<option value="2">Urban</option>
</select>
</div>

<button type="submit">Predict Loan Status</button>

</form>

<div class="result">
{{ prediction_text }}
</div>

</div>

</body>
</html>
